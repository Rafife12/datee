<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Convite pra um Date</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="hearts" id="hearts"></div>

<div class="phone">
  <div class="screen">

    <!-- Etapa 1: pergunta -->
    <div class="step active" id="step1">
      <div class="pill" id="pleaText">Só uma pergunta rápida...</div>
      <div class="emoji-big">🥺</div>
      <div class="card">
        <h2>Você aceitaria ir a um date comigo?</h2>
        <div class="row-btns">
          <button class="btn btn-yes" onclick="goStep(2)">SIM</button>
          <button class="btn-no" id="noBtn">não</button>
        </div>
      </div>
    </div>

    <!-- Etapa 2: nome de quem está respondendo -->
    <div class="step" id="step2">
      <div class="emoji-big">💌</div>
      <div class="card">
        <h2>Antes de continuar...</h2>
        <label>Qual é o seu nome?</label>
        <input type="text" id="nameInput" placeholder="Digite seu nome">
        <button class="btn btn-yes" onclick="confirmName()">Continuar 👉</button>
      </div>
    </div>

    <!-- Etapa 3: celebração -->
    <div class="step" id="step3">
      <div class="emoji-big">
        <img src="img/Ney.jpg" alt="foto" class="photo-circle">
      </div>
      <div class="card">
        <h2 id="celebTitle">Tô contigo! ❤️</h2>
        <p style="margin:0 0 6px;font-size:14px;">Fica pronta que eu vou te buscar 😏</p>
        <button class="btn btn-yes" onclick="goStep(4)">Continuar 👉</button>
      </div>
    </div>

    <!-- Etapa 4: data e horário -->
    <div class="step" id="step4">
      <div class="card">
        <h2>📅 Quando você tá livre?</h2>
        <label>Escolha a data</label>
        <input type="date" id="dateInput">
        <label>Escolha o horário</label>
        <input type="time" id="timeInput" value="19:00">
        <button class="btn btn-yes" onclick="confirmDate()">Selecionar a data 👉</button>
      </div>
    </div>

    <!-- Etapa 5: comida -->
    <div class="step" id="step5">
      <div class="card">
        <h2>O que tá afim? 😋</h2>
        <div class="food-grid" id="foodGrid">
          <div class="food" data-v="Hambúrguer">🍔<span></span>Hambúrguer</div>
          <div class="food" data-v="Sushi">🍣<span></span>Sushi</div>
          <div class="food" data-v="Massas">🍝<span></span>Massas</div>
          <div class="food" data-v="Tacos">🌮<span></span>Tacos</div>
          <div class="food" data-v="Pizza">🍕<span></span>Pizza</div>
          <div class="food" data-v="Praia">🏖️<span></span>Praia</div>
          <div class="food" data-v="Sorvete">🍦<span></span>Sorvete</div>
          <div class="food" data-v="Churrasco">🥩<span></span>Churrasco</div>
          <div class="food" data-v="Açaí">🫐<span></span>Açaí</div>
          <div class="food" data-v="Surpresa">🎁<span></span>Surpresa</div>
        </div>
        <div class="surprise-box" id="surpriseBox" style="display:none;">
          <label>Me conta sua ideia de date 👀</label>
          <input type="text" id="surpriseText" placeholder="Ex: piquenique ao pôr do sol">
        </div>
        <button class="btn btn-yes" onclick="finish()">Bora! ❤️</button>
      </div>
    </div>

    <!-- Etapa 6: resumo final -->
    <div class="step" id="step6">
      <div class="emoji-big">💌</div>
      <div class="card">
        <h2>Combinado! ❤️</h2>
        <div class="summary" id="summary"></div>
      </div>
    </div>

  </div>
</div>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
